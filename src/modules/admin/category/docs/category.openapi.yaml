# CONTROL DE VERSIONES
info:
  title: DOC for Category
  version: 1.0.1
openapi: 3.1.0
components:
  responses:
    # Peticion sin estar autenticado
    Unauthorized:
      description: Usuario no autenticado
      content:
        application/json:
          schema:
            type: object

            properties:
              msg:
                type: string
                example: No Autorizado

    # Peticion cuando no encuentra una categoria en la DB
    Inexisted:
      description: Categoria no encontrada
      content:
        application/json:
          schema:
            type: object

            properties:
              error:
                type: string
                example: La categoria no existe

# RUTAS DE CATEGORIA
paths:
  /api/category:
    # createCategory (rootCategory)
    post:
      tags:
        - Category

      summary: Crear una categoria raiz - createCategory (rootCategory)

      description: Crea una nueva categoría.

      security:
        - bearerAuth: []

      requestBody:
        content:
          application/json:
            schema:
              type: object

              properties:
                name:
                  type: string
                  example: "Maquillaje"

                position:
                  type: integer
                  example: 1

              required:
                - name
                - position

      responses:
        "201":
          description: Mensaje de exito

          content:
            text/plain:
              schema:
                type: string
                example: Categoria creada!

        "400":
          description: Errores de validacion

          content:
            application/json:
              schema:
                type: object

                properties:
                  errors:
                    type: array

                    items:
                      type: object

                      properties:
                        type:
                          type: string
                          example: field

                        msg:
                          type: string
                          example: El nombre de la categoria no puede ir vacio

                        path:
                          type: string

                        location:
                          type: string

                      required:
                        - type
                        - msg
                        - path
                        - location
                required:
                  - errors

        "401":
          $ref: "#/components/responses/Unauthorized"

        "409":
          description: Conflicto con categoria con nombre duplicado

          content:
            application/json:
              schema:
                type: object

                properties:
                  error:
                    type: string
                    example: Ya existe una categoría con el nombre Cremas

    # getRootCategories
    get:
      tags:
        - Category

      summary: Obtener categorías principales - getRootCategories

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Lista de categorías obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      example: 4ab89809-d343-4470-b241-daf85ab0f014
                    name:
                      type: string
                      example: Maquillaje
                    position:
                      type: number
                      example: 1

        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/category/{uuid}:
    # getSubCategoriesByUuid
    get:
      tags:
        - Category

      summary: Obtener las sub-categorias de una categoria raiz - getSubCategoriesByUuid

      description: Obtiene una categoría específica utilizando su UUID.

      security:
        - bearerAuth: []

      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID de la categoria raiz
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Lista las subcategorias de una categoria raiz
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Cremas

                  children:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          example: 0033e201-2606-4f86-972c-6183de9e8798
                        name:
                          type: string
                          example: Cremas Faciales
                        description:
                          type: string
                          example: Cremas de con ingredientes puros, que garantisan el cuidado maximo
                        position:
                          type: number
                          example: 1
                        imageURL:
                          type: string
                          example: https://res.cloudinary.com/daxosw10b/image/upload/v1776179700/petite_amelie/qhctgp4bwwlhmayhfpbz.webp

        "400":
          description: Error uuid invalido de una categoria

          content:
            application/json:
              schema:
                type: object

                properties:
                  errors:
                    type: array

                    items:
                      type: object

                      properties:
                        type:
                          type: string
                          example: field

                        value:
                          type: string
                          example: hola-que-hace

                        msg:
                          type: string
                          example: Categoria no valida

                        path:
                          type: string

                        location:
                          type: string

                      required:
                        - type
                        - value
                        - msg
                        - path
                        - location
                required:
                  - errors

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/Inexisted"

  /api/category/{categoryUuid}/category:
    # getCategory
    get:
      tags:
        - Category

      summary: Obtener una categoria - getCategory

      description: Obtiene una categoria por su uuid

      security:
        - bearerAuth: []

      parameters:
        - name: categoryUuid
          in: path
          required: true
          description: UUID de la categoria
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Informacion general de categorias
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Cremas Faciales
                  position:
                    type: number
                    example: 1
                  imageURL:
                    type:
                      - string
                      - "null"
                    example: https://res.cloudinary.com/daxosw10b/image/upload/v1776179700/petite_amelie/qhctgp4bwwlhmayhfpbz.webp
                  description:
                    type:
                      - string
                      - "null"
                    example: Cremas de con ingredientes puros, que garantisan el cuidado maximo

        "400":
          description: Error uuid invalido de una categoria

          content:
            application/json:
              schema:
                type: object

                properties:
                  errors:
                    type: array

                    items:
                      type: object

                      properties:
                        type:
                          type: string
                          example: field

                        value:
                          type: string
                          example: hola-que-hace

                        msg:
                          type: string
                          example: Categoria no valida

                        path:
                          type: string

                        location:
                          type: string

                      required:
                        - type
                        - value
                        - msg
                        - path
                        - location
                required:
                  - errors

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/Inexisted"

  /api/category/{categoryUuid}/rootCategory:
    # updateRootCategory
    put:
      tags:
        - Category

      summary: Actualiza una categoria raiz - updateRootCategory

      description: Actualiza una rootCategory por su uuid

      security:
        - bearerAuth: []

      parameters:
        - name: categoryUuid
          in: path
          required: true
          description: UUID de la categoria
          schema:
            type: string
            format: uuid

      requestBody:
        content:
          application/json:
            schema:
              type: object

              properties:
                name:
                  type: string
                  example: Cremas Actualizado
                position:
                  type: number
                  example: 2

      responses:
        "200":
          description: Mensaje de exito

          content:
            text/plain:
              schema:
                type: string
                example: Categoria actualizada!

        "400":
          description: Comprueba errors de validacion formulario

          content:
            application/json:
              schema:
                type: object

                properties:
                  errors:
                    type: array

                    items:
                      type: object

                      properties:
                        type:
                          type: string
                        value:
                          type: string
                        msg:
                          type: string
                        path:
                          type: string
                        location:
                          type: string

                      required:
                        - type
                        - msg
                        - path
                        - location

                required:
                  - errors

              examples:
                validationBody:
                  summary: Errores de validación del body
                  value:
                    errors:
                      - type: field
                        msg: El nombre no puede ir vacio
                        path: name
                        location: body

                      - type: field
                        msg: La posicion debe ser un numero
                        path: position
                        location: body

                invalidUUID:
                  summary: Error por uuid invalido
                  value:
                    errors:
                      - type: field
                        value: uuid_ingresado
                        msg: Categoria no valida
                        path: categoryUuid
                        location: params

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/Inexisted"

  /api/category/{subCategoryId}/subCategory:
    # updateSubCategory
    put:
      tags:
        - Category

      summary: Actualiza una sub-categoria

      description: Actualiza una subCategory por su uuid

      security:
        - bearerAuth: []

      parameters:
        - name: subCategoryId
          in: path
          required: true
          description: UUID de la sub-categoria
          schema:
            type: string
            format: uuid

      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Cremas - Actualizado

                image:
                  type: string
                  format: binary

                description:
                  type: string
                  example: Cremas de acuerdo con tu sensibilidad en tu piel, producto exelente
                  minimum: 50
                  maximum: 90

                position:
                  type: number
                  example: 1

              required:
                - name
                - image
                - description
                - position

      responses:
        "200":
          description: Mensaje de exito

          content:
            text/plain:
              schema:
                type: string
                example: Categoria actualizada!

        "400":
          description: Errores de validacion de formulario
          content:
            application/json:
              schema:
                type: object

                properties:
                  errors:
                    type: array

                    items:
                      type: object

                      properties:
                        type:
                          type: string
                        msg:
                          type: string
                        path:
                          type: string
                        location:
                          type: string

                      required:
                        - type
                        - msg
                        - path
                        - location

                required:
                  - errors
                example:
                  errors:
                    - type: field
                      msg: El nombre no puede ir vacio
                      path: name
                      location: body

                    - type: field
                      msg: Posicion no validá
                      path: position
                      location: body

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/Inexisted"
